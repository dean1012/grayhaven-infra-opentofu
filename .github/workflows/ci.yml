name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      TF_VAR_state_encryption_passphrase_baseline: offline-test-baseline-state-passphrase
      TF_VAR_state_encryption_passphrase_staging: offline-test-staging-state-passphrase
      TF_VAR_state_encryption_passphrase_prod: offline-test-prod-state-passphrase

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2

      - name: Run actionlint
        uses: devops-actions/actionlint@f0cc2d5a1078b5a03ef9c95a2c32f38d4e63e5ff  # v0.1.12

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          version: v0.11.0
          additional_files: scripts/read-vault-config

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

      - name: Initialize OpenTofu
        run: tofu init -backend=false

      - name: Validate OpenTofu configuration
        run: tofu validate

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25  # v24.0.0
        with:
          globs: |
            **/*.md
            !.terraform/**

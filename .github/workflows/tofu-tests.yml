name: OpenTofu Plan Tests

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-tests:
    name: Offline Plan Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2

      - name: Initialize OpenTofu
        run: tofu init -backend=false

      - name: Run offline OpenTofu plan tests
        env:
          TF_VAR_state_encryption_passphrase_baseline: offline-test-baseline-state-passphrase
          TF_VAR_state_encryption_passphrase_staging: offline-test-staging-state-passphrase
          TF_VAR_state_encryption_passphrase_prod: offline-test-prod-state-passphrase
        run: |
          tofu workspace new baseline
          tofu test -filter=tests/baseline.tftest.hcl -no-color

          tofu workspace new staging
          tofu test -filter=tests/staging.tftest.hcl -no-color

          tofu workspace new prod
          tofu test -filter=tests/prod.tftest.hcl -no-color

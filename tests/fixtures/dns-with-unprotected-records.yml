---
ttl: 300

domains:
  grayhaven_systems:
    name: grayhavensystems.com
    environment:
      apex: true
      web_aliases: true
    records:
      infrastructure_notice_a:
        type: A
        name: infra
        value: 192.0.2.10
      infrastructure_notice_cname:
        type: CNAME
        name: notice
        value: infra.grayhavensystems.com.
      infrastructure_notice_txt:
        type: TXT
        name: _infrastructure
        value: "Grayhaven Systems LLC infrastructure-managed DNS"
    protected_records:
      protected_a:
        type: A
        name: protected
        value: 192.0.2.20
      mx_primary:
        type: MX
        name: "@"
        value: mail.protonmail.ch.
        priority: 10

  jerry_smith:
    name: jerry-smith.net
    environment:
      apex: true
      web_aliases: true
    protected_records:
      mx_primary:
        type: MX
        name: "@"
        value: mail.protonmail.ch.
        priority: 10

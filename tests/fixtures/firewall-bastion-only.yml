---
firewalls:
  bastion:
    inbound:
      - protocol: tcp
        port_range: "22"
        source_addresses:
          - 0.0.0.0/0
    outbound:
      - protocol: tcp
        port_range: "443"
        destination_addresses:
          - 0.0.0.0/0
      - protocol: tcp
        port_range: "22"
        destination_tags:
          - web
          - mcp
